name: Mirage
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "202610260400"
targets:
  Mirage:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      # the game itself lives in joshuatree; these are its files, not copies
      - path: ../../joshuatree/user/mirage.c
      - path: ../../joshuatree/user/libjt/text.c
      # Icon Composer bundle; Xcode builds every icon size from it
      - path: Mirage.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.mirage
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mirage
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright 2026 Joshua Trommel. MIT License.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.adventure-games
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Mirage-macOS.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: App/Mirage-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../joshuatree/user
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) MIRAGE_EMBED=1"
        OTHER_CFLAGS: "-Wno-unused-function"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: Mirage
        DEVELOPMENT_TEAM: QMM486NPYC
schemes:
  Mirage:
    build: {targets: {Mirage: all}}
    shared: true
